# Quantumult X 域名节点分流规则与策略组
# 已有配置：把下列内容分别合并到同名区段。
# 保留已有 server_remote；节点名称需与 Cloudflare 订阅一致。
# 语法依据：https://github.com/crossutility/Quantumult-X/blob/master/sample.conf

[policy]
static = 节点选择, CF-域名直连

[filter_local]
# 节点订阅和局域网直连
host, node.284021.xyz, direct
host, localhost, direct
host-suffix, local, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 100.64.0.0/10, direct
ip-cidr, 169.254.0.0/16, direct
ip-cidr, 224.0.0.0/4, direct
ip6-cidr, ::1/128, direct
ip6-cidr, fc00::/7, direct
ip6-cidr, fe80::/10, direct
ip6-cidr, ff00::/8, direct

# 常用海外服务：排在国内 IP 判断之前
host-suffix, google.com, 节点选择
host-suffix, googleapis.com, 节点选择
host-suffix, gstatic.com, 节点选择
